<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doing It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/renderer/theme.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- Header Mounted Here -->
    <div id="header-root"></div>

    <!-- Main View Stack -->
    <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative;">
      <div id="view-tasks"></div>
      <div id="view-notes" style="display:none;"></div>
      <div id="view-focus" style="display:none;"></div>
      <div id="view-planner" style="display:none;"></div>
    </main>

    <!-- Raycast Command Palette Modal -->
    <div id="palette-root"></div>

    <!-- In-App Settings Modal -->
    <div id="settings-root"></div>

    <!-- Toast HUD Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Third Party Markdown & Sanitization Engines -->
  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/purify.min.js"></script>

  <!-- Core Services & Shared Modules -->
  <script src="src/renderer/toast.js"></script>
  <script src="src/renderer/audio.js"></script>
  <script src="src/renderer/markdown.js"></script>
  <script src="src/renderer/store/state.js"></script>

  <!-- Modern Desktop UI Components -->
  <script src="src/renderer/components/Header.js"></script>
  <script src="src/renderer/components/TasksView.js"></script>
  <script src="src/renderer/components/NotesView.js"></script>
  <script src="src/renderer/components/FocusView.js"></script>
  <script src="src/renderer/components/PlannerView.js"></script>
  <script src="src/renderer/components/Palette.js"></script>
  <script src="src/renderer/components/SettingsView.js"></script>

  <!-- App Controller Entry Point -->
  <script src="src/renderer/app.js"></script>
</body>
</html>
